databaseChangeLog:
  - changeSet:
      id: 004-create-outbox-events
      author: order-service
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: aggregate_id, type: uuid, constraints: { nullable: false } }
              - column: { name: type, type: varchar(64), constraints: { nullable: false } }
              - column: { name: payload, type: jsonb, constraints: { nullable: false } }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone }
        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_status_created
            columns:
              - column: { name: status }
              - column: { name: created_at }