databaseChangeLog:
  - changeSet:
      id: 003-create-invoices
      author: order-service
      changes:
        - createTable:
            tableName: invoices
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_invoices_order
                    foreignKeyName: fk_invoices_order
                    references: orders(id)
                    deleteCascade: true
              - column: { name: external_id, type: varchar(255) }
              - column: { name: number, type: varchar(255) }
              - column: { name: pdf_url, type: varchar(255) }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: attempts, type: integer, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: last_error, type: varchar(1000) }
              - column: { name: issued_at, type: timestamp with time zone }
              - column: { name: created_at, type: timestamp with time zone }